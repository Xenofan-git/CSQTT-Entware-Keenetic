name: Build WPE Auth Entware

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config python3 python3-pip git curl xz-utils gperf unifdef             libglib2.0-dev libicu-dev libgcrypt20-dev libsoup-3.0-dev libtasn1-6-dev libxkbcommon-dev libfontconfig1-dev libdrm-dev             libxml2-dev libxslt1-dev libsqlite3-dev libjpeg-dev libpng-dev libharfbuzz-dev libhyphen-dev libseccomp-dev libsystemd-dev libwoff-dev             libepoxy-dev libavif-dev libwebp-dev
      - name: Install portable CMake 3.30
        run: |
          set -eux
          mkdir -p "$HOME/cmake"
          curl -fL --retry 5 https://github.com/Kitware/CMake/releases/download/v3.30.5/cmake-3.30.5-linux-x86_64.tar.gz -o /tmp/cmake.tar.gz
          tar -xzf /tmp/cmake.tar.gz -C "$HOME/cmake" --strip-components=1
          echo "$HOME/cmake/bin" >> "$GITHUB_PATH"
          "$HOME/cmake/bin/cmake" --version

      - name: Download WPE WebKit 2.54.0
        run: |
          curl -fL --retry 5 https://wpewebkit.org/releases/wpewebkit-2.54.0.tar.xz -o wpewebkit-2.54.0.tar.xz
          echo "efa9bcc3cb891c2d88f50eec710d9ccee71cbdf1040420361eb98c17355eb452  wpewebkit-2.54.0.tar.xz" | sha256sum -c -
          tar -xf wpewebkit-2.54.0.tar.xz
      - name: Apply WPE 2.54 headless build patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path("wpewebkit-2.54.0/Source/WebCore/bindings/js/JSHTMLMediaElementCustom.cpp").write_text(
              '#include "config.h"\n#if 0 /* media disabled for headless auth build */\n#endif\n')
          p=Path("wpewebkit-2.54.0/Source/WebKit/UIProcess/wpe/AcceleratedBackingStore.cpp")
          s=p.read_text()
          if "DRM_FORMAT_XRGB8888 0x34325258U" not in s:
              p.write_text("#ifndef DRM_FORMAT_XRGB8888\n#define DRM_FORMAT_XRGB8888 0x34325258U\n#endif\n"+s)
          p=Path("wpewebkit-2.54.0/Source/cmake/FindGLib.cmake")
          s=p.read_text()
          start=s.index("if (NOT GLib_VERSION AND EXISTS")
          end=s.index("endif ()", start)+len("endif ()")
          replacement='if (NOT GLib_VERSION)\n    set(GLib_VERSION "2.82.0")\nendif ()'
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
          PY
      - name: Configure WPE
        run: |
          cmake -S wpewebkit-2.54.0 -B build-wpe -G Ninja -DPORT=WPE -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/wpe-install"             -DENABLE_WPE_LEGACY_API=OFF -DENABLE_INTROSPECTION=OFF -DENABLE_DOCUMENTATION=OFF -DENABLE_WPE_PLATFORM_DRM=OFF             -DENABLE_WPE_PLATFORM_WAYLAND=OFF -DENABLE_WPE_QT_API=OFF -DENABLE_JOURNALD_LOG=OFF -DENABLE_SPEECH_SYNTHESIS=OFF             -DENABLE_SPELLCHECK=OFF -DENABLE_BUBBLEWRAP_SANDBOX=OFF -DUSE_ATK=OFF -DUSE_AVIF=OFF -DUSE_JPEGXL=OFF             -DUSE_LIBINPUT=OFF -DUSE_LCMS=OFF -DUSE_GBM=OFF -DUSE_LIBDRM=OFF -DUSE_LIBBACKTRACE=OFF -DUSE_SYSPROF_CAPTURE=OFF             -DUSE_SYSTEM_SYSPROF_CAPTURE=OFF -DENABLE_GPU_PROCESS=OFF -DUSE_VULKAN=OFF -DENABLE_WEBDRIVER=OFF -DENABLE_GAMEPAD=OFF             -DENABLE_VIDEO=OFF -DENABLE_WEB_AUDIO=OFF -DENABLE_SPELLCHECKING=OFF -DUSE_GSTREAMER=OFF -DUSE_GSTREAMER_WEBRTC=OFF             -DUSE_OPENGL=OFF -DUSE_LIBHYPHEN=OFF -DENABLE_WEBXR=OFF -DENABLE_WEB_RTC=OFF -DENABLE_PDFJS=OFF -DENABLE_WEB_CODECS=OFF             -DENABLE_MHTML=OFF -DENABLE_NOTIFICATIONS=OFF -DENABLE_OFFSCREEN_CANVAS=OFF -DENABLE_OFFSCREEN_CANVAS_IN_WORKERS=OFF             -DENABLE_PERIODIC_MEMORY_MONITOR=OFF -DENABLE_SHAREABLE_RESOURCE=OFF -DENABLE_TOUCH_EVENTS=OFF -DENABLE_VARIATION_FONTS=OFF             -DENABLE_MOUSE_CURSOR_SCALE=OFF -DENABLE_POINTER_LOCK=OFF -DENABLE_RESOURCE_USAGE=OFF -DENABLE_MEMORY_SAMPLER=OFF             -DENABLE_API_TESTS=OFF -DENABLE_LAYOUT_TESTS=OFF -DENABLE_MINIBROWSER=OFF
      - name: Build and stage WPE
        run: |
          cmake --build build-wpe --parallel 2
          cmake --install build-wpe
      - name: Build probe
        run: |
          cmake -S . -B build-probe -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/wpe-install" -DPKG_CONFIG_PATH="$PWD/wpe-install/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake --build build-probe --parallel 2
      - name: Package native artifact
        run: |
          mkdir -p dist/wpe-auth
          cp build-probe/wpe-auth dist/wpe-auth/
          cp README.md dist/wpe-auth/
          tar -C dist -czf wpe-auth-native.tar.gz wpe-auth
      - uses: actions/upload-artifact@v4
        with:
          name: wpe-auth-native
          path: wpe-auth-native.tar.gz

  verify-entware-toolchain:
    runs-on: ubuntu-latest
    container:
      image: waujito/entware_builder:aarch64-3.10
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact Entware target toolchain
        working-directory: /home/me/Entware
        run: |
          set -eux
          test -x /home/me/Entware/staging_dir/toolchain-aarch64_cortex-a53_gcc-8.4.0_glibc-2.27/bin/aarch64-openwrt-linux-gnu-gcc
          CC=/home/me/Entware/staging_dir/toolchain-aarch64_cortex-a53_gcc-8.4.0_glibc-2.27/bin/aarch64-openwrt-linux-gnu-gcc
          $CC --version
          printf 'int main(void){return 0;}\n' >/tmp/probe.c
          $CC -O2 -mcpu=cortex-a53 -Wl,--dynamic-linker=/opt/lib/ld-linux-aarch64.so.1 /tmp/probe.c -o /tmp/probe
          file /tmp/probe
          readelf -l /tmp/probe | grep 'Requesting program interpreter'
          readelf -V /tmp/probe | grep 'GLIBC_2.27' || true
      - name: Upload ARM64 toolchain probe
        uses: actions/upload-artifact@v4
        with:
          name: entware-aarch64-toolchain-probe
          path: /tmp/probe

  build-arm64-entware:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: waujito/entware_builder:aarch64-3.10
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-build host tools
        run: |
          set -eux
          # The builder image is Debian bullseye and its security mirror may
          # contain stale package indexes. Install only host tools from the
          # main repository; curl/xz/git are already present in the image.
          if command -v apt-get >/dev/null 2>&1; then
            sed -i '/bullseye-security/d' /etc/apt/sources.list || true
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake ninja-build pkg-config gperf unifdef ruby dpkg
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache cmake ninja pkgconf python3 gperf unifdef
          else
            echo "No supported package manager in Entware builder"
            cat /etc/os-release || true
            exit 1
          fi
          command -v cmake
          command -v ninja
          command -v pkg-config
          command -v curl
          command -v xz

      - name: Install portable CMake 3.30 for ARM64 build
        run: |
          set -eux
          mkdir -p "$HOME/cmake"
          curl -fL --retry 5 https://github.com/Kitware/CMake/releases/download/v3.30.5/cmake-3.30.5-linux-x86_64.tar.gz -o /tmp/cmake.tar.gz
          tar -xzf /tmp/cmake.tar.gz -C "$HOME/cmake" --strip-components=1
          echo "$HOME/cmake/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/cmake/bin:$PATH"
          cmake --version

      - name: Install Clang runtime compatibility
        run: |
          set -eux
          if command -v apt-get >/dev/null 2>&1; then
            sed -i '/bullseye-security/d' /etc/apt/sources.list || true
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libtinfo5
          fi

      - name: Install portable Clang 18 for ARM64 build
        run: |
          set -eux
          mkdir -p "$HOME/llvm"
          curl -fL --retry 5 https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz -o /tmp/llvm.tar.xz
          tar -xJf /tmp/llvm.tar.xz -C "$HOME/llvm" --strip-components=1
          echo "$HOME/llvm/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/llvm/bin:$PATH"
          clang --version
          clang++ --version

      - name: Inspect Entware target sysroot
        working-directory: /home/me/Entware
        run: |
          set -eux
          TC=/home/me/Entware/staging_dir/toolchain-aarch64_cortex-a53_gcc-8.4.0_glibc-2.27
          TARGET=/home/me/Entware/staging_dir/target-aarch64_cortex-a53_glibc-2.27
          test -d "$TC"
          test -d "$TARGET"
          ls -ld "$TC" "$TARGET"
          "$TC/bin/aarch64-openwrt-linux-gnu-gcc" --version
          cmake --version
          ninja --version
          pkg-config --version
          python3 --version

      - name: Inspect Entware target GLib development files
        working-directory: /home/me/Entware
        run: |
          set -eux
          TARGET=/home/me/Entware/staging_dir/target-aarch64_cortex-a53_glibc-2.27
          TC=/home/me/Entware/staging_dir/toolchain-aarch64_cortex-a53_gcc-8.4.0_glibc-2.27
          echo "=== target top ==="
          find "$TARGET" -maxdepth 5 \( -name 'glib-2.0.pc' -o -name 'glib.h' -o -name 'libglib-2.0.so*' \) -print | head -100
          echo "=== pkgconfig dirs ==="
          find "$TARGET" -type d -name pkgconfig -print | head -100
          echo "=== compiler sysroot headers ==="
          find "$TC/aarch64-openwrt-linux-gnu/sysroot" -maxdepth 4 \( -name 'features.h' -o -name 'stdlib.h' \) -print | head -50
          echo "=== target includes ==="
          ls -la "$TARGET/usr/include" 2>/dev/null | head -50 || true
          ls -la "$TARGET/opt/include" 2>/dev/null | head -50 || true
          echo "=== target glib ==="
          find "$TARGET/usr" "$TARGET/opt" -maxdepth 6 -type f \( -name 'glib.h' -o -name 'libglib-2.0.so*' -o -name 'glib-2.0.pc' \) -print 2>/dev/null | head -100
          echo "=== target pkgconfig files ==="
          find "$TARGET" -type f -name '*.pc' -print | head -100
          echo "=== native pkg-config search ==="
          pkg-config --print-search-paths || true

      - name: Inspect Entware target GLib development files
        working-directory: /home/me/Entware
        run: |
          set -eux
          TARGET=/home/me/Entware/staging_dir/target-aarch64_cortex-a53_glibc-2.27
          TC=/home/me/Entware/staging_dir/toolchain-aarch64_cortex-a53_gcc-8.4.0_glibc-2.27
          echo '=== GLib files ==='
          find "$TARGET" -type f \( -name 'glib-2.0.pc' -o -name 'glib.h' -o -name 'libglib-2.0.so*' \) -print | head -100
          echo '=== pkgconfig dirs ==='
          find "$TARGET" -type d -name pkgconfig -print | head -100
          echo '=== target include roots ==='
          find "$TARGET" -maxdepth 3 -type d -name include -print
          echo '=== sysroot headers ==='
          find "$TC/aarch64-openwrt-linux-gnu/sysroot" -maxdepth 5 \( -name features.h -o -name stdlib.h \) -print | head -50
          echo '=== likely Entware staging headers ==='
          find "$TC" -type f \( -name features.h -o -name glib.h \) -print | head -100
          echo '=== GLib pkg-config candidates ==='
          find /home/me/Entware/staging_dir -type f -name 'glib-2.0.pc' -print | head -100
          echo '=== target libraries ==='
          find "$TARGET" -type f \( -name 'libglib-2.0.so*' -o -name 'libgobject-2.0.so*' \) -print | head -100

      - name: Bootstrap Entware target development sysroot
        working-directory: /home/me/Entware
        run: |
          set -eux
          TARGET=/home/me/Entware/staging_dir/target-aarch64_cortex-a53_glibc-2.27
          mkdir -p "$TARGET/opt"
          curl -fL --retry 5 https://bin.entware.net/aarch64-k3.10/include/include.tar.gz -o /tmp/entware-include.tar.gz
          tar -xzf /tmp/entware-include.tar.gz -C "$TARGET/opt"
          python3 - <<'PY'
          import gzip, re, subprocess, urllib.request
          from pathlib import Path
          base='https://bin.entware.net/aarch64-k3.10/'
          target=Path('/home/me/Entware/staging_dir/target-aarch64_cortex-a53_glibc-2.27')
          raw=gzip.decompress(urllib.request.urlopen(base+'Packages.gz').read()).decode()
          # Parse by Package headers; the Entware index is not guaranteed to
          # use blank lines as stanza separators.
          pkgs={}
          blocks=re.split(r'(?m)^Package: ', raw)
          for tail in blocks[1:]:
              block='Package: '+tail
              fields={}
              for line in block.splitlines():
                  if ': ' in line:
                      k,v=line.split(': ',1); fields[k]=v
              if fields.get('Package') and fields.get('Filename'):
                  pkgs[fields['Package']]=fields
          wanted={'glib2','glib2-dev','libgcrypt','libgcrypt-dev','libgpg-error','libgpg-error-dev','icu','libsoup3','libtasn1','libxkbcommon','fontconfig','libxml2','libxml2-dev','libxslt','libsqlite3','libjpeg-turbo','libpng','libwebp'}
          selected=set()
          queue=list(wanted)
          while queue:
              name=queue.pop()
              if name in selected or name not in pkgs: continue
              selected.add(name)
              deps=pkgs[name].get('Depends','')
              for d in deps.split(','):
                  d=d.strip()
                  if not d: continue
                  for alt in d.split('|'):
                      m=re.match(r'([A-Za-z0-9+_.-]+)',alt.strip())
                      if m and m.group(1) in pkgs:
                          queue.append(m.group(1)); break
          print('Selected target packages:', sorted(selected))
          for name in sorted(selected):
              f=pkgs[name]['Filename']
              out=Path('/tmp')/Path(f).name
              urllib.request.urlretrieve(base+f,out)
              subprocess.run(['ar','x',str(out)],cwd='/tmp/ipk-'+name,check=False) if False else None
              d=Path('/tmp/ipk-'+name); d.mkdir(exist_ok=True)
              # Entware IPKs are ar archives, but some builder images have
              # an ar implementation that rejects otherwise valid packages.
              # Extract the data.tar.* member ourselves to avoid host ar quirks.
              # Entware IPKs encountered in the builder may be either an ar
              # container or a tar container. In both cases the real payload is
              # data.tar.*; never feed the outer IPK directly to tar extraction.
              import tarfile
              data=None
              try:
                  with tarfile.open(out, 'r:*') as outer:
                      members=outer.getmembers()
                      names=[m.name.lstrip('./') for m in members]
                      print(f'{name}: outer tar entries={len(names)} first={names[:8]}')
                      for m in members:
                          clean=m.name.lstrip('./')
                          if clean.startswith('data.tar'):
                              data=d/(Path(clean).name)
                              src=outer.extractfile(m)
                              if src is None:
                                  raise RuntimeError(f'Cannot read {m.name} from {out}')
                              data.write_bytes(src.read())
                              break
              except tarfile.TarError:
                  data=None

              if data is None:
                  blob=out.read_bytes()
                  if not blob.startswith(b'!<arch>\\n'):
                      raise RuntimeError(f'Unsupported IPK container in {out}: magic={blob[:16].hex()}')
                  pos=8
                  while pos + 60 <= len(blob):
                      hdr=blob[pos:pos+60]
                      size=int(hdr[48:58].strip() or b'0')
                      member=hdr[:16].decode('utf-8','replace').strip().rstrip('/').lstrip('./')
                      start=pos+60
                      end=start+size
                      payload=blob[start:end]
                      print(f'{name}: ar member={member!r} size={size} magic={payload[:8].hex()}')
                      if member.startswith('data.tar'):
                          data=d/(Path(member).name)
                          data.write_bytes(payload)
                          break
                      pos=end + (size & 1)
              if data is None:
                  raise RuntimeError(f'No data.tar member in {out}')

              with tarfile.open(data, 'r:*') as tf:
                  names=tf.getnames()
                  print(f'{name}: data archive entries={len(names)} first={names[:8]}')
                  tf.extractall(target)
          PY
          mkdir -p "$TARGET/opt/lib/pkgconfig"
          printf '%s\n' 'prefix=/opt' 'libdir=/opt/lib' 'includedir=/opt/include' 'Name: GLib' 'Description: GLib core library' 'Version: 2.82.0' 'Requires: libpcre2-8' 'Libs: -L/opt/lib -lglib-2.0' 'Cflags: -I/opt/include/glib-2.0 -I/opt/lib/glib-2.0/include' > "$TARGET/opt/lib/pkgconfig/glib-2.0.pc"
          printf '%s\n' 'prefix=/opt' 'libdir=/opt/lib' 'includedir=/opt/include' 'Name: GObject' 'Description: GLib GObject library' 'Version: 2.82.0' 'Requires: glib-2.0' 'Libs: -L/opt/lib -lgobject-2.0' 'Cflags: -I/opt/include/glib-2.0 -I/opt/lib/glib-2.0/include' > "$TARGET/opt/lib/pkgconfig/gobject-2.0.pc"
          printf '%s\n' 'prefix=/opt' 'libdir=/opt/lib' 'includedir=/opt/include' 'Name: GIO' 'Description: GLib GIO library' 'Version: 2.82.0' 'Requires: gobject-2.0' 'Libs: -L/opt/lib -lgio-2.0' 'Cflags: -I/opt/include/glib-2.0 -I/opt/lib/glib-2.0/include' > "$TARGET/opt/lib/pkgconfig/gio-2.0.pc"
          printf '%s\n' 'prefix=/opt' 'libdir=/opt/lib' 'includedir=/opt/include' 'Name: GModule' 'Description: GLib module loading library' 'Version: 2.82.0' 'Requires: glib-2.0' 'Libs: -L/opt/lib -lgmodule-2.0' 'Cflags: -I/opt/include/glib-2.0 -I/opt/lib/glib-2.0/include' > "$TARGET/opt/lib/pkgconfig/gmodule-2.0.pc"
          echo '=== bootstrapped target files ==='
          echo '=== package extraction markers ==='
          find "$TARGET/opt" -maxdepth 5 -type f | head -100
          echo '=== bootstrapped GLib/pkgconfig ==='
          find "$TARGET" -type f \( -name 'glib-2.0.pc' -o -name 'gio-2.0.pc' -o -name 'gobject-2.0.pc' -o -name 'libglib-2.0.so*' \) -print | head -100
          GLIB_PC="$(find "$TARGET" -type f -name 'glib-2.0.pc' -print -quit)"
          test -n "$GLIB_PC"
          GLIB_PC_DIR="$(dirname "$GLIB_PC")"
          GLIB_ROOT="$(printf '%s' "$GLIB_PC_DIR" | sed 's#/lib/pkgconfig$##')"
          echo "Detected GLib pkg-config dir: $GLIB_PC_DIR"
          echo "Detected GLib root: $GLIB_ROOT"

      - name: Download WPE WebKit 2.54.0
        run: |
          curl -fL --retry 5 https://wpewebkit.org/releases/wpewebkit-2.54.0.tar.xz -o wpewebkit-2.54.0.tar.xz
          echo "efa9bcc3cb891c2d88f50eec710d9ccee71cbdf1040420361eb98c17355eb452  wpewebkit-2.54.0.tar.xz" | sha256sum -c -
          tar -xf wpewebkit-2.54.0.tar.xz

      - name: Apply WPE headless patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path("wpewebkit-2.54.0/Source/WebCore/bindings/js/JSHTMLMediaElementCustom.cpp").write_text(
              '#include "config.h"\n#if 0 /* media disabled for headless auth build */\n#endif\n')
          p=Path("wpewebkit-2.54.0/Source/WebKit/UIProcess/wpe/AcceleratedBackingStore.cpp")
          s=p.read_text()
          if "DRM_FORMAT_XRGB8888 0x34325258U" not in s:
              p.write_text("#ifndef DRM_FORMAT_XRGB8888\n#define DRM_FORMAT_XRGB8888 0x34325258U\n#endif\n"+s)
          p=Path("wpewebkit-2.54.0/Source/cmake/FindGLib.cmake")
          s=p.read_text()
          start=s.index("if (NOT GLib_VERSION AND EXISTS")
          end=s.index("endif ()", start)+len("endif ()")
          replacement='if (NOT GLib_VERSION)\n    set(GLib_VERSION "2.82.0")\nendif ()'
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
          PY

      - name: Configure WPE for ARM64 Entware
        working-directory: /home/me/Entware
        run: |
          set -eux
          TC=/home/me/Entware/staging_dir/toolchain-aarch64_cortex-a53_gcc-8.4.0_glibc-2.27
          TARGET=/home/me/Entware/staging_dir/target-aarch64_cortex-a53_glibc-2.27
          cd "$GITHUB_WORKSPACE"
          cat > entware-aarch64.cmake <<EOF
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER $HOME/llvm/bin/clang)
          set(CMAKE_CXX_COMPILER $HOME/llvm/bin/clang++)
          set(CMAKE_C_COMPILER_TARGET aarch64-openwrt-linux-gnu)
          set(CMAKE_CXX_COMPILER_TARGET aarch64-openwrt-linux-gnu)
          set(CMAKE_AR $TC/bin/aarch64-openwrt-linux-gnu-ar)
          set(CMAKE_RANLIB $TC/bin/aarch64-openwrt-linux-gnu-ranlib)
          set(CMAKE_STRIP $TC/bin/aarch64-openwrt-linux-gnu-strip)
          set(CMAKE_SYSROOT $TARGET)
          set(CMAKE_FIND_ROOT_PATH $TARGET $TC)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
          set(CMAKE_C_FLAGS "--target=aarch64-openwrt-linux-gnu --sysroot=$TARGET --gcc-toolchain=$TC -B$TC/bin -mcpu=cortex-a53 -isystem $TC/include -isystem $TARGET/usr/include -isystem $TARGET/opt/include -isystem $TARGET/opt/lib/glib-2.0/include")
          set(CMAKE_CXX_FLAGS "-nostdinc++ --target=aarch64-openwrt-linux-gnu --sysroot=$TARGET --gcc-toolchain=$TC -B$TC/bin -mcpu=cortex-a53 -isystem $TC/aarch64-openwrt-linux-gnu/include/c++/8.4.0 -isystem $TC/aarch64-openwrt-linux-gnu/include/c++/8.4.0/aarch64-openwrt-linux-gnu -isystem $TC/aarch64-openwrt-linux-gnu/include/c++/8.4.0/backward -isystem $TC/lib64/gcc/aarch64-openwrt-linux-gnu/8.4.0/include -isystem $TC/lib64/gcc/aarch64-openwrt-linux-gnu/8.4.0/include-fixed -isystem $TC/include -isystem $TARGET/usr/include -isystem $TARGET/opt/include -isystem $TARGET/opt/lib/glib-2.0/include")
          EOF
          # Entware aarch64-k3.10 currently has no HarfBuzz package in Packages.gz.
          # Build a minimal HarfBuzz for the target instead of relying on a nonexistent
          # harfbuzz-dev package. WPE only needs the core HarfBuzz library here.
          curl -fL --retry 5 https://github.com/harfbuzz/harfbuzz/releases/download/10.2.0/harfbuzz-10.2.0.tar.xz -o /tmp/harfbuzz-10.2.0.tar.xz
          rm -rf /tmp/harfbuzz-10.2.0 /tmp/build-harfbuzz-arm64
          tar -xf /tmp/harfbuzz-10.2.0.tar.xz -C /tmp
          cmake -S /tmp/harfbuzz-10.2.0 -B /tmp/build-harfbuzz-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/entware-aarch64.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt \
            -DBUILD_SHARED_LIBS=ON \
            -DHB_HAVE_GLIB=OFF \
            -DHB_HAVE_ICU=ON \
            -DHB_HAVE_FREETYPE=OFF \
            -DHB_HAVE_GRAPHITE2=OFF \
            -DHB_HAVE_GOBJECT=OFF \
            -DHB_BUILD_UTILS=OFF \
            -DHB_BUILD_SUBSET=OFF \
            -DHB_BUILD_RASTER=OFF \
            -DHB_BUILD_VECTOR=OFF \
            -DHB_BUILD_GPU=OFF
          cmake --build /tmp/build-harfbuzz-arm64 --parallel 2
          DESTDIR="$TARGET" cmake --install /tmp/build-harfbuzz-arm64
          test -f "$TARGET/opt/lib/pkgconfig/harfbuzz.pc"
          # Entware provides the glibc runtime but not the libc development headers.
          # Supply the exact glibc 2.27 AArch64 headers used by this target toolchain.
          curl -fL --retry 5 https://archive.ubuntu.com/ubuntu/pool/main/c/cross-toolchain-base/libc6-dev-arm64-cross_2.27-3ubuntu1cross1.1_all.deb -o /tmp/libc6-dev-arm64-cross.deb
          rm -rf /tmp/libc6-dev-arm64-cross
          dpkg-deb -x /tmp/libc6-dev-arm64-cross.deb /tmp/libc6-dev-arm64-cross
          mkdir -p "$TARGET/usr/include"
          cp -a /tmp/libc6-dev-arm64-cross/usr/aarch64-linux-gnu/include/. "$TARGET/usr/include/"
          test -f "$TARGET/usr/include/math.h"
          CXX_INC="$TC/aarch64-openwrt-linux-gnu/include/c++/8.4.0"
          sed -i 's/#include_next <math.h>/#include <math.h>/' "$CXX_INC/cmath"
          sed -i 's/#include_next <stdlib.h>/#include <stdlib.h>/' "$CXX_INC/cstdlib"
          test -f "$CXX_INC/cmath"
          test -f "$CXX_INC/cstdlib"
          # Entware aarch64-k3.10 does not ship libepoxy. Build it for the exact target toolchain.
          cat > /tmp/build_epoxy.py <<'PY'
          import os, shutil, subprocess, tarfile, urllib.request
          from pathlib import Path
          root=Path('/tmp/epoxy-build')
          if root.exists(): shutil.rmtree(root)
          root.mkdir()
          meson_tar=root/'meson.tar.gz'
          epoxy_tar=root/'epoxy.tar.xz'
          urllib.request.urlretrieve('https://github.com/mesonbuild/meson/releases/download/1.5.2/meson-1.5.2.tar.gz', meson_tar)
          urllib.request.urlretrieve('https://download.gnome.org/sources/libepoxy/1.5/libepoxy-1.5.10.tar.xz', epoxy_tar)
          meson_src=root/'meson-src'; epoxy_src=root/'epoxy-src'
          meson_src.mkdir(); epoxy_src.mkdir()
          with tarfile.open(meson_tar,'r:gz') as tf: tf.extractall(meson_src)
          with tarfile.open(epoxy_tar,'r:*') as tf: tf.extractall(epoxy_src)
          meson_main=next(meson_src.rglob('mesonbuild/mesonmain.py'))
          epoxy_root=next(p for p in epoxy_src.iterdir() if p.is_dir())
          target=Path(os.environ['TARGET']); tc=Path(os.environ['TC'])
          cross=Path('/tmp/meson-cross-arm64.ini')
          cross.write_text(f"""[binaries]
          c = '{os.environ.get('GITHUB_HOME','/github/home')}/llvm/bin/clang'
          cpp = '{os.environ.get('GITHUB_HOME','/github/home')}/llvm/bin/clang++'
          ar = '{tc}/bin/aarch64-openwrt-linux-gnu-ar'
          strip = '{tc}/bin/aarch64-openwrt-linux-gnu-strip'
          pkgconfig = 'pkg-config'
          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'cortex-a53'
          endian = 'little'
          [properties]
          sys_root = '{target}'
          [built-in options]
          c_args = ['--target=aarch64-openwrt-linux-gnu','--sysroot={target}','--gcc-toolchain={tc}','-B{tc}/bin','-mcpu=cortex-a53','-isystem','{tc}/include','-isystem','{target}/usr/include','-isystem','{target}/opt/include']
          cpp_args = ['-nostdinc++','--target=aarch64-openwrt-linux-gnu','--sysroot={target}','--gcc-toolchain={tc}','-B{tc}/bin','-mcpu=cortex-a53','-isystem','{tc}/aarch64-openwrt-linux-gnu/include/c++/8.4.0','-isystem','{tc}/aarch64-openwrt-linux-gnu/include/c++/8.4.0/aarch64-openwrt-linux-gnu','-isystem','{tc}/aarch64-openwrt-linux-gnu/include/c++/8.4.0/backward','-isystem','{tc}/include','-isystem','{target}/usr/include','-isystem','{target}/opt/include']
          c_link_args = ['--target=aarch64-openwrt-linux-gnu','--sysroot={target}','--gcc-toolchain={tc}','-B{tc}/bin','-mcpu=cortex-a53']
          cpp_link_args = ['--target=aarch64-openwrt-linux-gnu','--sysroot={target}','--gcc-toolchain={tc}','-B{tc}/bin','-mcpu=cortex-a53']
          """)
          env=os.environ.copy(); env['PYTHONPATH']=str(meson_main.parent.parent)
          env['PKG_CONFIG_SYSROOT_DIR']=str(target)
          env['PKG_CONFIG_LIBDIR']=f"{target}/opt/lib/pkgconfig:{target}/usr/lib/pkgconfig"
          build='/tmp/build-libepoxy-arm64'
          subprocess.run(['python3','-m','mesonbuild.mesonmain','setup',build,str(epoxy_root),'--cross-file',str(cross),'--prefix','/opt','--libdir','lib','-Dtests=false','-Dx11=false'],env=env,check=True)
          subprocess.run(['python3','-m','mesonbuild.mesonmain','compile','-C',build,'-j','2'],env=env,check=True)
          env['DESTDIR']=str(target)
          subprocess.run(['python3','-m','mesonbuild.mesonmain','install','-C',build],env=env,check=True)
          assert (target/'opt/lib/libepoxy.so').exists()
          assert (target/'opt/lib/pkgconfig/epoxy.pc').exists()
          PY
          export TARGET TC GITHUB_HOME
          # Entware ships runtime-only LibGcrypt/GpgError objects. WPE's CMake finder
          # expects development linker names; expose the same ABI-compatible libraries under
          # their standard -dev names without importing a foreign binary.
          ln -sf libgcrypt.so.20.6.0 "$TARGET/opt/lib/libgcrypt.so"
          ln -sf libgpg-error.so.0.41.1 "$TARGET/opt/lib/libgpg-error.so"
          test -e "$TARGET/opt/lib/libgcrypt.so"
          test -e "$TARGET/opt/lib/libgpg-error.so"
          printf '%s\n' 'prefix=/opt' 'libdir=/opt/lib' 'includedir=/opt/include' 'Name: libpcre2-8' 'Description: PCRE2 8-bit library' 'Version: 10.46' 'Libs: -L/opt/lib -lpcre2-8' 'Cflags: -I/opt/include' > "$TARGET/opt/lib/pkgconfig/libpcre2-8.pc"
          NGHTTP_SO="$(find "$TARGET/opt/lib" -maxdepth 1 -name 'libnghttp2.so.*' -print -quit)"
          test -n "$NGHTTP_SO"
          ln -sf "$(basename "$NGHTTP_SO")" "$TARGET/opt/lib/libnghttp2.so"
          printf '%s\n' 'prefix=/opt' 'libdir=/opt/lib' 'includedir=/opt/include' 'Name: libnghttp2' 'Description: HTTP/2 protocol library' 'Version: 1.64.0' 'Libs: -L/opt/lib -lnghttp2' 'Cflags: -I/opt/include' > "$TARGET/opt/lib/pkgconfig/libnghttp2.pc"
          ln -sf libpcre2-8.so.0.12.0 "$TARGET/opt/lib/libpcre2-8.so"
          # Entware's libsoup3 package is runtime-only. Build libsoup 3.0.8 with its
          # own Meson source tree so this block is independent of temporary paths.
          cat > /tmp/build_libsoup.py <<'PY'
          import os, shutil, subprocess, tarfile, urllib.request
          from pathlib import Path
          root=Path('/tmp/libsoup-build')
          if root.exists(): shutil.rmtree(root)
          root.mkdir()
          meson_tar=root/'meson.tar.gz'
          soup_tar=root/'libsoup.tar.xz'
          urllib.request.urlretrieve('https://github.com/mesonbuild/meson/releases/download/1.5.2/meson-1.5.2.tar.gz', meson_tar)
          urllib.request.urlretrieve('https://download.gnome.org/sources/libsoup/3.0/libsoup-3.0.8.tar.xz', soup_tar)
          meson_src=root/'meson-src'; soup_src=root/'soup-src'
          meson_src.mkdir(); soup_src.mkdir()
          with tarfile.open(meson_tar,'r:gz') as tf: tf.extractall(meson_src)
          with tarfile.open(soup_tar,'r:*') as tf: tf.extractall(soup_src)
          meson_main=next(meson_src.rglob('mesonbuild/mesonmain.py'))
          soup_root=next(p for p in soup_src.iterdir() if p.is_dir())
          target=Path(os.environ['TARGET']); tc=Path(os.environ['TC'])
          cross=Path(root/'meson-cross-arm64.ini')
          cross.write_text(f"""[binaries]
          c = '{os.environ.get('GITHUB_HOME','/github/home')}/llvm/bin/clang'
          cpp = '{os.environ.get('GITHUB_HOME','/github/home')}/llvm/bin/clang++'
          ar = '{tc}/bin/aarch64-openwrt-linux-gnu-ar'
          strip = '{tc}/bin/aarch64-openwrt-linux-gnu-strip'
          pkgconfig = 'pkg-config'
          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'cortex-a53'
          endian = 'little'
          [properties]
          sys_root = '{target}'
          [built-in options]
          c_args = ['--target=aarch64-openwrt-linux-gnu','--sysroot={target}','--gcc-toolchain={tc}','-B{tc}/bin','-mcpu=cortex-a53','-isystem','{tc}/include','-isystem','{target}/usr/include','-isystem','{target}/opt/include']
          cpp_args = ['-nostdinc++','--target=aarch64-openwrt-linux-gnu','--sysroot={target}','--gcc-toolchain={tc}','-B{tc}/bin','-mcpu=cortex-a53','-isystem','{tc}/aarch64-openwrt-linux-gnu/include/c++/8.4.0','-isystem','{tc}/aarch64-openwrt-linux-gnu/include/c++/8.4.0/aarch64-openwrt-linux-gnu','-isystem','{tc}/aarch64-openwrt-linux-gnu/include/c++/8.4.0/backward','-isystem','{tc}/include','-isystem','{target}/usr/include','-isystem','{target}/opt/include']
          c_link_args = ['--target=aarch64-openwrt-linux-gnu','--sysroot={target}','--gcc-toolchain={tc}','-B{tc}/bin','-mcpu=cortex-a53']
          cpp_link_args = ['--target=aarch64-openwrt-linux-gnu','--sysroot={target}','--gcc-toolchain={tc}','-B{tc}/bin','-mcpu=cortex-a53']
          """)
          env=os.environ.copy(); env['PYTHONPATH']=str(meson_main.parent.parent)
          env['PKG_CONFIG_SYSROOT_DIR']=str(target)
          env['PKG_CONFIG_LIBDIR']=f"{target}/opt/lib/pkgconfig:{target}/usr/lib/pkgconfig:{target}/usr/share/pkgconfig"
          build='/tmp/build-libsoup-arm64'
          opts=['-Dtests=false','-Dvapi=disabled','-Dintrospection=disabled','-Dsysprof=disabled','-Dgssapi=disabled','-Dntlm=disabled','-Dbrotli=disabled','-Dtls_check=false']
          subprocess.run(['python3','-m','mesonbuild.mesonmain','setup',build,str(soup_root),'--cross-file',str(cross),'--prefix','/opt','--libdir','lib',*opts],env=env,check=True)
          subprocess.run(['python3','-m','mesonbuild.mesonmain','compile','-C',build,'-j','2'],env=env,check=True)
          env['DESTDIR']=str(target)
          subprocess.run(['python3','-m','mesonbuild.mesonmain','install','-C',build],env=env,check=True)
          assert (target/'opt/lib/pkgconfig/libsoup-3.0.pc').exists()
          assert any(target.rglob('soup.h'))
          PY
          export TARGET TC GITHUB_HOME
          python3 /tmp/build_libsoup.py
          ln -sf libsoup-3.0.so.0.7.4 "$TARGET/opt/lib/libsoup-3.0.so"
          # Epoxy needs Khronos EGL/GL headers; libglvnd-dev provides the complete,
          # internally consistent header set (EGL/GL/KHR) without target-specific binaries.
          apt-get update
          apt-get download libegl-dev libgl-dev libgles-dev libopengl-dev
          rm -rf /tmp/gl-dev
          mkdir -p /tmp/gl-dev
          for deb in libegl-dev_*.deb libgl-dev_*.deb libgles-dev_*.deb libopengl-dev_*.deb; do
            dpkg-deb -x "$deb" /tmp/gl-dev
          done
          cp -a /tmp/gl-dev/usr/include/EGL "$TARGET/opt/include/"
          cp -a /tmp/gl-dev/usr/include/GL "$TARGET/opt/include/"
          cp -a /tmp/gl-dev/usr/include/GLES* "$TARGET/opt/include/" 2>/dev/null || true
          cp -a /tmp/gl-dev/usr/include/KHR "$TARGET/opt/include/"
          test -f "$TARGET/opt/include/EGL/eglplatform.h"
          test -f "$TARGET/opt/include/GL/gl.h"
          test -f "$TARGET/opt/include/KHR/khrplatform.h"
          python3 /tmp/build_epoxy.py
          GLIB_PC="$(find "$TARGET" -type f -name 'glib-2.0.pc' -print -quit)"
          GLIB_PC_DIR="$(dirname "$GLIB_PC")"
          export PKG_CONFIG_LIBDIR="$GLIB_PC_DIR:$TARGET/opt/lib/pkgconfig:$TARGET/usr/lib/pkgconfig:$TARGET/usr/share/pkgconfig"
          export PKG_CONFIG_PATH=""
          cmake -S "$GITHUB_WORKSPACE/wpewebkit-2.54.0" -B "$GITHUB_WORKSPACE/build-wpe-arm64" -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/entware-aarch64.cmake"             -DPORT=WPE             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_INSTALL_PREFIX=/opt/wpe             -DENABLE_WPE_LEGACY_API=OFF             -DENABLE_INTROSPECTION=OFF             -DENABLE_DOCUMENTATION=OFF             -DENABLE_WPE_PLATFORM_DRM=OFF             -DENABLE_WPE_PLATFORM_WAYLAND=OFF             -DENABLE_WPE_QT_API=OFF             -DENABLE_JOURNALD_LOG=OFF             -DENABLE_SPEECH_SYNTHESIS=OFF             -DENABLE_SPELLCHECK=OFF             -DENABLE_BUBBLEWRAP_SANDBOX=OFF             -DUSE_ATK=OFF -DUSE_AVIF=OFF -DUSE_JPEGXL=OFF -DUSE_LIBINPUT=OFF -DUSE_LCMS=OFF             -DUSE_GBM=OFF -DUSE_LIBDRM=OFF -DUSE_LIBBACKTRACE=OFF             -DUSE_SYSPROF_CAPTURE=OFF -DUSE_SYSTEM_SYSPROF_CAPTURE=OFF             -DENABLE_GPU_PROCESS=OFF -DUSE_VULKAN=OFF -DENABLE_WEBDRIVER=OFF -DENABLE_GAMEPAD=OFF             -DENABLE_VIDEO=OFF -DENABLE_WEB_AUDIO=OFF -DENABLE_SPELLCHECKING=OFF             -DUSE_GSTREAMER=OFF -DUSE_GSTREAMER_WEBRTC=OFF -DUSE_OPENGL=OFF             -DUSE_LIBHYPHEN=OFF -DENABLE_WEBXR=OFF -DENABLE_WEB_RTC=OFF             -DENABLE_PDFJS=OFF -DENABLE_WEB_CODECS=OFF -DENABLE_MHTML=OFF             -DENABLE_NOTIFICATIONS=OFF -DENABLE_OFFSCREEN_CANVAS=OFF             -DENABLE_OFFSCREEN_CANVAS_IN_WORKERS=OFF -DENABLE_PERIODIC_MEMORY_MONITOR=OFF             -DENABLE_SHAREABLE_RESOURCE=OFF -DENABLE_TOUCH_EVENTS=OFF -DENABLE_VARIATION_FONTS=OFF             -DENABLE_MOUSE_CURSOR_SCALE=OFF -DENABLE_POINTER_LOCK=OFF -DENABLE_RESOURCE_USAGE=OFF             -DENABLE_MEMORY_SAMPLER=OFF -DENABLE_API_TESTS=OFF -DENABLE_LAYOUT_TESTS=OFF             -DENABLE_MINIBROWSER=OFF

      - name: Build and stage WPE ARM64
        run: |
          set -eux
          export PATH="$HOME/cmake/bin:$HOME/llvm/bin:$PATH"
          cmake --build "$GITHUB_WORKSPACE/build-wpe-arm64" --parallel 2
          rm -rf "$GITHUB_WORKSPACE/arm64-root"
          DESTDIR="$GITHUB_WORKSPACE/arm64-root" cmake --install "$GITHUB_WORKSPACE/build-wpe-arm64"

      - name: Package ARM64 artifact
        run: |
          set -eux
          mkdir -p dist/wpe-auth-arm64
          if [ -d arm64-root/opt ]; then cp -a arm64-root/opt/. dist/wpe-auth-arm64/; fi
          cp README.md dist/wpe-auth-arm64/
          tar -C dist -czf wpe-auth-arm64.tar.gz wpe-auth-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: wpe-auth-arm64
          path: wpe-auth-arm64.tar.gz
